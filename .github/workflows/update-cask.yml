# When a release is published, points the Homebrew cask at its installer package, checked
# against the release's SHA256SUMS.txt. Prereleases and drafts leave the cask alone.
name: Update the Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to point the cask at, as v1.0.8
        required: true

permissions:
  contents: write

jobs:
  cask:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the cask at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          package="GougeSmartInput-$version.pkg"
          gh release download "$TAG" --pattern SHA256SUMS.txt --pattern "$package" --dir release
          (cd release && shasum -a 256 -c SHA256SUMS.txt --ignore-missing)
          sha=$(awk -v name="$package" '$2 == name || $2 == "*" name { print $1 }' release/SHA256SUMS.txt)
          if [ ${#sha} -ne 64 ]; then
            echo "::error::SHA256SUMS.txt has no checksum for $package."
            exit 1
          fi
          sed -i -E "s/^  version \".*\"$/  version \"$version\"/; s/^  sha256 \"[0-9a-f]{64}\"$/  sha256 \"$sha\"/" Casks/gouge-smart-input.rb
          if git diff --quiet; then
            echo "The cask already points at $version."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$version: Point the cask at the release"
          git push origin HEAD:main
